const cols = [
  { key: "player", label: "Player" },
  { key: "pos", label: "Pos", cls: "muted" },
  { key: "rights", label: "Rights", fmt: v => v || "free agent" },
  { key: "draft_price", label: "Paid " + D.season, num: true, fmt: v => v === "" ? "undrafted" : "$" + v },
  ...D.next.map((s, i) => ({ key: "keeper_" + s, label: (i === 0 ? "Keeper " : "") + s, num: true,
                             fmt: v => "$" + v, cls: i === 0 ? "k1" : "" })),
  { key: "notes", label: "Notes", cls: "note", sortable: false },
];
const rows = D.rows.map(r => {
  const n = [];
  if (r.fab_paid !== "") n.push("FAB $" + r.fab_paid);
  if (r.drafted_by && r.drafted_by !== r.rights) n.push("drafted by " + r.drafted_by);
  if (r.moves) n.push(r.moves);
  return { ...r, notes: n.join(", ") };
});
const byTeam = Object.fromEntries(D.teams.map(t => [t.team, t]));
let sortKey = "keeper_" + D.next[0], sortDir = -1;

if (D.drafted < D.slots) {
  const w = document.getElementById("warn");
  w.hidden = false;
  w.textContent = `Draft log incomplete: ${D.drafted} of ${D.slots} picks recorded so far.`;
}
const sel = document.getElementById("team");
[...D.teams].sort((a, b) => a.team.localeCompare(b.team)).forEach(t => {
  const o = document.createElement("option");
  o.value = t.team; o.textContent = `${t.team} (${t.manager})`;
  sel.append(o);
});
if (rows.some(r => !r.rights)) {
  const o = document.createElement("option"); o.value = "__fa"; o.textContent = "Free agents"; sel.append(o);
}

const head = document.getElementById("head");
cols.forEach(c => {
  const th = document.createElement("th");
  th.textContent = c.label;
  if (c.num) th.className = "num";
  if (c.sortable !== false) th.addEventListener("click", () => {
    sortDir = sortKey === c.key ? -sortDir : (c.num ? -1 : 1);
    sortKey = c.key; render();
  });
  c.th = th; head.append(th);
});

function cmp(a, b) {
  const x = a[sortKey], y = b[sortKey];
  const xe = x === "" || x == null, ye = y === "" || y == null;
  if (xe || ye) return xe - ye;
  return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const t = sel.value;
  const list = rows.filter(r =>
    (!q || r.player.toLowerCase().includes(q)) &&
    (!t || (t === "__fa" ? !r.rights : r.rights === t))
  ).sort(cmp);
  cols.forEach(c => c.th.setAttribute("aria-sort",
    c.key === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none"));
  const body = document.getElementById("body");
  body.replaceChildren(...list.map(r => {
    const tr = document.createElement("tr");
    cols.forEach(c => {
      const td = document.createElement("td");
      td.textContent = c.fmt ? c.fmt(r[c.key]) : r[c.key];
      td.className = [c.num ? "num" : "", c.cls || ""].join(" ").trim();
      tr.append(td);
    });
    return tr;
  }));
  const s = document.getElementById("summary");
  if (t && t !== "__fa") {
    const k = list.reduce((a, r) => a + r["keeper_" + D.next[0]], 0);
    const tm = byTeam[t];
    s.textContent = `${tm.manager} · ${list.length} players · ${D.next[0]} keeper cost if all kept: $${k} (budget $${tm.budget})`;
  } else {
    s.textContent = `${list.length} players`;
  }
}
document.getElementById("q").addEventListener("input", render);
sel.addEventListener("change", render);
render();
</script>
